[project]
name = "horcrux"
version = "0.2.0"
description = "연구실 실험 기록·문제 진단 CLI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "fastapi", "httpx"]  # tests/test_server.py가 fastapi.testclient(→httpx)를 import
release = ["build", "pyinstaller"]
web = ["fastapi", "uvicorn"]
deploy = ["anthropic", "supabase", "PyJWT", "cryptography"]

[project.scripts]
horcrux = "horcrux.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
